camera:
  source_type: usb
  usb_index: 0
  width: 1280
  height: 720
  fps: 30
  ip_url: "rtsp://127.0.0.1:8554/stream"
  reconnect_ms: 1500

processing:
  map_width: 800
  map_height: 800
  aruco_dict: DICT_4X4_50
  corner_ids: [0, 1, 2, 3]
  start_corner: bottom_left 
  map_inset_pct: 0.0
  start_line_thickness_pct: 0.03
  goal_size_pct: 0.16
  diff_threshold: 30
  goal_ratio_threshold: 0.02
  finish_consecutive_frames: 3
  debounce_ms: 80

ui:
  show_raw_preview: true
  show_warped_preview: true
